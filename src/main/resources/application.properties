# Configuration BDD Postgres
spring.application.name=bibliotheque
spring.datasource.url=jdbc:postgresql://localhost:5432/bibliotheque
spring.datasource.username=postgres
spring.datasource.password=PostgresqL@1602
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Création automatique des tables 
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# debug=false
# server.port=8080

# LOGS
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# INTERFACES
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
